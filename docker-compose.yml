services:
  mysql:
    image: mysql:8.0
    container_name: salessavvy-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Shashi@2003
      MYSQL_DATABASE: salessavvy_app
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pShashi@2003"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: salessavvy-backend
    ports:
      - "9090:9090"
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    container_name: salessavvy-frontend
    ports:
      - "5174:5174"
    depends_on:
      - backend

volumes:
  mysql_data: