services:

  backend:
    build: ./backend
    container_name: salessavvy-backend
    ports:
      - "9090:9090"
    environment:
      DB_URL: "jdbc:mysql://mysql-7f1b984-salesavvy-app.a.aivencloud.com:10625/salessavvy_app?sslMode=REQUIRED"
      DB_USERNAME: "avnadmin"
      DB_PASSWORD: "${DB_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRATION: "3600000"
      RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID}"
      RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET}"
    restart: always

  frontend:
    build: ./frontend
    container_name: salessavvy-frontend
    ports:
      - "5174:5174"
    depends_on:
      - backend
